[project]
name = "agents-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Parth Khare", email = "khare.parth2112@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agents-langchain = "agents_langchain:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
